[project]
name = "file-metadata-extractor-tools"
version = "0.1.0"
description = "Dict wrapper for os.stat returning size, timestamps, mode, uid, and gid"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
